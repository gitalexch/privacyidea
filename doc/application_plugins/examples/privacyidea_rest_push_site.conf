# FreeRADIUS 3.2.x: sites-available/privacyidea_push (enable this virtual server).
# Use a dedicated PAP listener; configure authorized NAS clients separately.
server privacyidea_push {
    listen {
        type = auth
        ipaddr = *
        port = 18120
    }
    authorize {
        if (!User-Name || !User-Password) {
            reject
        }
        update control {
            Auth-Type := privacyidea_push
        }
    }
    authenticate {
        Auth-Type privacyidea_push {
            update control {
                Response-Packet-Type := Access-Reject
                REST-HTTP-Header := "User-Agent: FreeRADIUS"
            }
            privacyidea_push {
                # Never let the default 'ok = return' accept an HTTP 204 or an empty HTTP 200.
                default = 1
            }
            if ((ok || updated) && &control:Response-Packet-Type == Access-Accept) {
                ok
            }
            elsif ((ok || updated) && &control:Response-Packet-Type == Access-Challenge && &reply:State) {
                challenge
            }
            else {
                update control {
                    Response-Packet-Type := Access-Reject
                }
                reject
            }
        }
    }
}
