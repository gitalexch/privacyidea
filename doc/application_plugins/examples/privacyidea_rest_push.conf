# FreeRADIUS 3.2.x: mods-available/privacyidea_push (enable the instance).
# Replace the hostname. Keep certificate and hostname verification enabled.
rest privacyidea_push {
    connect_uri = "https://privacyidea.example"
    connect_timeout = 4.0
    tls {
        check_cert = yes
        check_cert_cn = yes
    }
    authenticate {
        uri = "${..connect_uri}/validate/radiuscheck?response_format=freeradius"
        method = 'post'
        body = 'post'
        data = "user=%{urlquote:%{User-Name}}&pass=%{urlquote:%{User-Password}}&state=%{urlquote:%{string:State}}&radius_nas=%{urlquote:%{Packet-Src-IP-Address}}"
        force_to = 'json'
        tls = ${..tls}
        timeout = 4.0
    }
    pool {
        start = 0
        min = 0
        max = 16
        spare = 2
    }
}
